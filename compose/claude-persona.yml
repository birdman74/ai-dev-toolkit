# Claude Code Persona — Docker Compose Template
#
# Copy this file and replace all placeholders marked with <REPLACE> before use.
#
# <REPLACE:workspace-name> must match the WORKDIR baked into the image
# (see dockerfiles/*/Dockerfile). Use the project name, e.g. `streamvault`,
# so in-container paths read naturally in persona output.
#
# Usage:
#   docker compose -f /mnt/e/docker/<REPLACE:project-persona>/docker-compose.yml run --rm claude-<REPLACE:project-persona>
#
# See docs/new-project-setup.md for full setup instructions.

services:
  claude-<REPLACE:project-persona>:
    image: <REPLACE:image-name>        # e.g. claude-po-img or claude-dev-img
    container_name: claude-<REPLACE:project-persona>
    stdin_open: true
    tty: true
    environment:
      - HOME=/home/brian
      - GIT_AUTHOR_NAME=claude-<REPLACE:project-persona>
      - GIT_AUTHOR_EMAIL=<REPLACE:your-email>+claude-<REPLACE:project-persona>@outlook.com
      - GIT_COMMITTER_NAME=claude-<REPLACE:project-persona>
      - GIT_COMMITTER_EMAIL=<REPLACE:your-email>+claude-<REPLACE:project-persona>@outlook.com
      - GIT_SSH_COMMAND=ssh -i /home/brian/.claude/git-identities/<REPLACE:project>/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/brian/.claude/git-identities/<REPLACE:project>/known_hosts
    volumes:
      - /home/brian/.claude:/home/brian/.claude
      - /home/brian/.claude.json:/home/brian/.claude.json
      - <REPLACE:/path/to/project>/.claude/personas/<REPLACE:persona>/CLAUDE.md:/home/brian/.claude/CLAUDE.md
      - <REPLACE:/path/to/project>:/<REPLACE:workspace-name>
