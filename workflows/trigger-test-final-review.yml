# trigger-test-final-review.yml
# Triggers Test persona for final verification when bot opens a PR.
# Replace all <REPLACE:...> placeholders before use.

name: Trigger Test — Final PR Review

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (e.g. story-002)'
        required: true
      feature_branch:
        description: 'Feature branch name'
        required: true
      pr_number:
        description: 'Pull request number'
        required: true

jobs:
  trigger-test-review:
    runs-on: self-hosted
    if: github.actor == '<REPLACE:bot-github-username>' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify story from branch name
        id: context
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STORY_ID="${{ github.event.inputs.story_id }}"
            BRANCH="${{ github.event.inputs.feature_branch }}"
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          else
            BRANCH="${{ github.head_ref }}"
            STORY_ID=$(echo "$BRANCH" | grep -oP 'story-\d+')
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          echo "story_id=$STORY_ID" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Launch Test persona for final review
        env:
          STORY_ID: ${{ steps.context.outputs.story_id }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          FEATURE_BRANCH: ${{ steps.context.outputs.branch }}
        run: |
          /home/<REPLACE:username>/bin/<REPLACE:project>-test-auto.sh "Dev has opened PR #$PR_NUMBER for $STORY_ID on $FEATURE_BRANCH. Execute your final verification phase per your CLAUDE.md: run the full suite, analyze the diff, write regression tests, post PR comment, and submit a formal gh pr review."
