# trigger-test-revision.yml
# Triggers Test persona to revise design after Dev feedback.
# Story ID and round derived from branch name and on-disk files -- no payload parsing.
# Replace all <REPLACE:...> placeholders before use.

name: Trigger Test — Dev Feedback Requires Revision

on:
  push:
    branches: ['feature/story-*']
    paths:
      - 'docs/specs/design/story-*-dev-feedback-r*.md'
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (e.g. story-002)'
        required: true
      feature_branch:
        description: 'Feature branch name'
        required: true
      revision_round:
        description: 'Revision round number'
        required: true
        default: '1'

jobs:
  trigger-test-revision:
    permissions:
      contents: read
    runs-on: self-hosted
    if: github.actor == '<REPLACE:your-github-username>' || github.actor == '<REPLACE:bot-github-username>' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify story and round
        id: context
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STORY_ID="${{ github.event.inputs.story_id }}"
            BRANCH="${{ github.event.inputs.feature_branch }}"
            ROUND="${{ github.event.inputs.revision_round }}"
          else
            BRANCH="${{ github.ref_name }}"
            STORY_ID=$(echo "$BRANCH" | grep -oP 'story-\d+')
            ROUND=0
            for i in 1 2 3; do
              if [ -f "docs/specs/design/${STORY_ID}-dev-feedback-r${i}.md" ]; then
                ROUND=$i
              fi
            done
          fi
          echo "story_id=$STORY_ID" >> $GITHUB_OUTPUT
          echo "round=$ROUND" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Story: $STORY_ID, Revision round: $ROUND, Branch: $BRANCH"

      - name: Launch Test persona for revision
        env:
          STORY_ID: ${{ steps.context.outputs.story_id }}
          REVISION_ROUND: ${{ steps.context.outputs.round }}
          FEATURE_BRANCH: ${{ steps.context.outputs.branch }}
        run: |
          /home/<REPLACE:username>/bin/<REPLACE:project>-test-auto.sh "Dev has committed feedback for $STORY_ID on $FEATURE_BRANCH. This is revision round $REVISION_ROUND. Execute your revision phase per your CLAUDE.md and push to origin/$FEATURE_BRANCH."